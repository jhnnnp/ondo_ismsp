name: Python CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run tests with coverage
        run: pytest

      - name: Check frontend JavaScript syntax
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(git ls-files 'src/isms_pii_toolkit/web/control_map/*.js' 'src/isms_pii_toolkit/web/control_map/**/*.js')

      - name: Run frontend unit tests
        run: node --test tests/js/control_map_pure.test.mjs
