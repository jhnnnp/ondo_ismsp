[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isms-p-self-assessment"
version = "0.1.0"
description = "ISMS-P 자가진단 및 통제 분석 도구"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "parkjinhan" }
]
dependencies = [
  "certifi>=2024.8.30",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
]
guides = [
  "pypdf>=5.0.0",
]

[project.scripts]
isms-p-api = "isms_pii_toolkit.api:run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isms_pii_toolkit = [
  "*.html",
  "web/landing/*.css",
  "web/landing/*.js",
  "web/control_map/*.css",
  "web/control_map/styles/*.css",
  "web/control_map/*.js",
  "web/control_map/core/*.js",
  "web/control_map/react-dist/*.js",
  "web/control_map/react-dist/*.css",
  "web/control_map/features/analysis/*.js",
  "web/control_map/features/assessment/*.js",
  "web/control_map/features/certification/*.js",
  "web/control_map/features/profile/*.js",
  "web/control_map/features/session/*.js",
  "web/control_map/features/sessions/*.js",
  "data/**/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "--cov=isms_pii_toolkit",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]

[tool.coverage.run]
source = ["isms_pii_toolkit"]
branch = false

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
]
show_missing = true
